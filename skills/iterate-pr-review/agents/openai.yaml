interface:
  display_name: "Iterate PR Review"
  short_description: "Iterate PR feedback until reviews converge"
  default_prompt: "Use $iterate-pr-review to run up to five change rounds on this pull request: delegate each exact-head Copilot request to the host reviewer-request workflow, consume its evidence, run independent reviews, apply accepted fixes, verify them, commit, push, and refresh the PR. Do not request other reviewers, post comments, replies, or reviews, resolve threads, change unrelated pull-request metadata, mark the PR ready, merge, or release unless I separately authorize those actions. Report feedback remaining after the final review-only pass."
